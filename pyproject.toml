[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cagfnet"
version = "1.0.0"
description = "Cross-Attention Gated Fusion of CT imaging and audiometric signals for cholesteatoma detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Azizbek Temirov" },
  { name = "Nozima Atadjanova" },
  { name = "Musabek Musayev" },
]
dependencies = [
  "torch>=2.0", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3",
  "pandas>=2.0", "matplotlib>=3.7", "PyYAML>=6.0", "tabulate>=0.9",
]

[project.scripts]
cagfnet-run = "cagfnet.experiments:main"

[tool.setuptools.packages.find]
include = ["cagfnet*"]
